<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Virtual</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="cabecera">
        <div class="contenedor cabecera__interior">
            <h1 class="cabecera__titulo">📚 Biblioteca Virtual</h1>
            <nav class="menu" aria-label="Menú principal">
                <button type="button" class="menu__opcion menu__opcion--activa" data-vista="alta">Cargar libro</button>
                <button type="button" class="menu__opcion" data-vista="listado">Listar libros</button>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <!-- ================= VISTA: ALTA DE LIBROS ================= -->
        <section id="vista-alta" class="vista">
            <div class="tarjeta">
                <h2 class="tarjeta__titulo">Cargar libro</h2>
                <p class="tarjeta__ayuda">Todos los campos son obligatorios.</p>

                <form id="form-libro" class="formulario" novalidate>
                    <div class="campo">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" name="titulo" maxlength="200" autocomplete="off" placeholder="Ej.: Rayuela">
                        <small class="campo__error" data-error="titulo"></small>
                    </div>

                    <div class="campo">
                        <label for="autor">Autor</label>
                        <input type="text" id="autor" name="autor" maxlength="200" autocomplete="off" placeholder="Ej.: Julio Cortázar">
                        <small class="campo__error" data-error="autor"></small>
                    </div>

                    <div class="campo">
                        <label for="genero">Género</label>
                        <input type="text" id="genero" name="genero" maxlength="200" autocomplete="off" list="generos-sugeridos" placeholder="Ej.: Novela">
                        <datalist id="generos-sugeridos">
                            <option value="Novela"></option>
                            <option value="Cuento"></option>
                            <option value="Poesía"></option>
                            <option value="Ensayo"></option>
                            <option value="Ciencia ficción"></option>
                            <option value="Policial"></option>
                            <option value="Historia"></option>
                            <option value="Técnico"></option>
                            <option value="Infantil"></option>
                        </datalist>
                        <small class="campo__error" data-error="genero"></small>
                    </div>

                    <div class="formulario__fila">
                        <div class="campo">
                            <label for="anioPublicacion">Año de publicación</label>
                            <input type="number" id="anioPublicacion" name="anioPublicacion" min="1" step="1" placeholder="Ej.: 1963">
                            <small class="campo__error" data-error="anioPublicacion"></small>
                        </div>

                        <div class="campo">
                            <label for="estado">Estado</label>
                            <select id="estado" name="estado">
                                <option value="Disponible" selected>Disponible</option>
                                <option value="Prestado">Prestado</option>
                            </select>
                            <small class="campo__error" data-error="estado"></small>
                        </div>
                    </div>

                    <div class="formulario__acciones">
                        <button type="submit" class="boton boton--primario">Guardar libro</button>
                        <button type="reset" class="boton boton--secundario">Limpiar</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- ================= VISTA: LISTADO DE LIBROS ================= -->
        <section id="vista-listado" class="vista vista--oculta">
            <div class="tarjeta">
                <div class="tarjeta__encabezado">
                    <div>
                        <h2 class="tarjeta__titulo">Listado de libros</h2>
                        <p class="tarjeta__ayuda">Ordenado alfabéticamente por autor y luego por título.</p>
                    </div>
                    <button type="button" id="btn-refrescar" class="boton boton--secundario">Actualizar</button>
                </div>

                <p id="contador" class="contador"></p>

                <div class="tabla__envoltorio">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th scope="col">Título</th>
                                <th scope="col">Autor</th>
                                <th scope="col">Género</th>
                                <th scope="col">Año</th>
                                <th scope="col">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-libros"></tbody>
                    </table>
                </div>

                <p id="mensaje-vacio" class="vacio vista--oculta">Todavía no hay libros cargados.</p>
            </div>
        </section>
    </main>

    <!-- Notificaciones -->
    <div id="alerta" class="alerta vista--oculta" role="status" aria-live="polite"></div>

    <script src="js/app.js"></script>
</body>
</html>
